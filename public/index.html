<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Molong 🦭 — a chatbot that remembers (Walrus Memory)</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a2e; --ink:#eaf0ff; --muted:#93a0c0;
    --acc:#5b8cff; --acc2:#7b5cff; --ok:#39d98a; --line:#222b45;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:radial-gradient(1200px 600px at 20% -10%,#1a2547 0,var(--bg) 55%);
       color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);
       background:rgba(19,26,46,.7);backdrop-filter:blur(8px);position:sticky;top:0}
  header .logo{font-size:26px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .ident{margin-left:auto;display:flex;gap:8px;align-items:center}
  .ident input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
       border-radius:10px;padding:8px 10px;font-size:13px;width:150px}
  .membtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);
       border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
  .membtn:hover{color:var(--ink)}
  #mempanel{display:none;position:sticky;top:64px;max-width:820px;width:100%;margin:0 auto 0;
       background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
       font-size:13px;color:var(--ink);max-height:34vh;overflow:auto}
  #mempanel h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
  #mempanel li{margin:4px 0;line-height:1.4}
  #mempanel .empty{color:var(--muted);font-style:italic}
  main{flex:1;overflow:auto;padding:20px;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;flex-direction:column;gap:4px;max-width:82%}
  .msg .who{font-size:11px;color:var(--muted);letter-spacing:.02em}
  .msg .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;
       line-height:1.45;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end}
  .msg.user .bubble{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff}
  .msg .meta{font-size:10.5px;color:var(--muted)}
  .msg .meta .ok{color:var(--ok)}
  .hint{align-self:center;color:var(--muted);font-size:12.5px;padding:8px}
  footer{padding:12px 16px 16px;border-top:1px solid var(--line);background:rgba(19,26,46,.7)}
  form{display:flex;gap:10px;max-width:820px;margin:0 auto}
  form input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
       border-radius:12px;padding:12px 14px;font-size:14.5px}
  form button{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;
       border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.6;cursor:wait}
  .typing .bubble{opacity:.7}
  @media(max-width:560px){.ident input{width:110px}.msg{max-width:90%}}
</style>
</head>
<body>
<header>
  <div class="logo">🦭</div>
  <div>
    <h1>Molong — remembers across sessions &amp; devices</h1>
    <div class="sub">long-term memory: Walrus Memory · model: <span id="model">…</span> · <a href="/support.html" style="color:var(--acc)">☕ CS demo</a></div>
  </div>
  <div class="ident">
    <button class="membtn" id="memshow" title="Show what Molong remembers about this user">🧠 my memory</button>
    <input id="user" placeholder="your name / id" autocomplete="off" />
  </div>
</header>
<div id="mempanel"><h3>🧠 what Molong remembers about <b id="memuser"></b></h3><ul id="memlist"></ul></div>
<main id="chat">
  <div class="hint">Say something. Try: “Remember I prefer concise answers” then ask later, in a new tab — Molong will still remember.</div>
</main>
<footer>
  <form id="f">
    <input type="text" id="in" placeholder="Message Molong…" autocomplete="off" />
    <button id="send">Send</button>
  </form>
</footer>
<script>
const chat=document.getElementById('chat'),in_=document.getElementById('in'),
      f=document.getElementById('f'),btn=document.getElementById('send'),user=document.getElementById('user');
user.value=localStorage.getItem('molong_user')||('user-'+Math.random().toString(36).slice(2,7));
user.addEventListener('change',()=>localStorage.setItem('molong_user',user.value));

function add(who,txt,meta){
  const d=document.createElement('div');d.className='msg '+who;
  const whoEl=document.createElement('div');whoEl.className='who';whoEl.textContent=who;
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=txt;
  d.append(whoEl,bubble);
  if(meta){
    const m=document.createElement('div');
    m.className='meta';
    m.textContent=meta;
    d.appendChild(m);
  }
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
async function health(){try{const r=await fetch('/api/health');const j=await r.json();
  document.getElementById('model').textContent=j.model+' · relayer '+(j.relayer||'');}catch{}}
health();setInterval(health,30000);

document.getElementById('memshow').addEventListener('click',async()=>{
  const p=document.getElementById('mempanel'),ul=document.getElementById('memlist'),
        mu=document.getElementById('memuser');
  const u=user.value.trim();mu.textContent=u;
  p.style.display='block';ul.textContent='loading…';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const r=await fetch('/api/memory?user='+encodeURIComponent(u));
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.statusText);
    ul.textContent = '';
    if (!j.memories.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = `nothing remembered yet for “${u}”.`;
      ul.appendChild(li);
      return;
    }
    j.memories.forEach(m => {
      const li = document.createElement('li');
      li.textContent = m;
      ul.appendChild(li);
    });
  }catch(err){ul.textContent='⚠️ '+(err.message||'error');}
});

f.addEventListener('submit',async e=>{
  e.preventDefault();const text=in_.value.trim();if(!text)return;
  in_.value='';btn.disabled=true;
  add('user',text);
  const think=add('molong','…');think.classList.add('typing');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,user:user.value.trim()})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.statusText);
    think.querySelector('.bubble').textContent=j.reply;think.classList.remove('typing');
    let meta='';
    if(j.memoriesRecalled>0)meta+='🧠 recalled '+j.memoriesRecalled+' memory'+(j.memoriesRecalled>1?'s':'')+' ';
    if(j.memoryQueued)meta+='· 🧠 remembering this…';
    if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;think.appendChild(m);}
  }catch(err){think.querySelector('.bubble').textContent='⚠️ '+(err.message||'error');think.classList.remove('typing');}
  btn.disabled=false;in_.focus();chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
